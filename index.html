<style>
/* Layout idea: investment ledger with the same tab structure as the ad ledger the user showed. Soft blue-grey canvas, white cards, Korean convention: red = gain, blue = loss. */
:root{
  --bg:#e9eef6; --bg2:#dbe5f4; --surface:#ffffff; --ink:#142033; --muted:#5b6b82; --line:#d5deeb;
  --accent:#1c5fd1; --pos:#d6323a; --neg:#1f5fd0; --warn:#b4690e; --soft:#eef3fb; --zebra:#f7f9fd; --shadow:0 1px 2px rgba(20,40,80,.06),0 8px 24px rgba(20,40,80,.07);
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --font-num:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --bg2:#13213a; --surface:#152033; --ink:#eaf0fa; --muted:#9db0c9; --line:#26364f;
  --accent:#6fa3ff; --pos:#ff7078; --neg:#6fa8ff; --warn:#f0b866; --soft:#1b2a44; --zebra:#182438; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1322; --bg2:#13213a; --surface:#152033; --ink:#eaf0fa; --muted:#9db0c9; --line:#26364f;
  --accent:#6fa3ff; --pos:#ff7078; --neg:#6fa8ff; --warn:#f0b866; --soft:#1b2a44; --zebra:#182438; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg2) 0,var(--bg) 320px);background-repeat:no-repeat;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;letter-spacing:-0.01em}
.wrap{max-width:1320px;margin:0 auto;padding:0 18px 70px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);margin:0 -18px;padding:12px 18px 0;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,40,80,.06)}
.title{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.02em}
.sub{color:var(--muted);font-size:13px}
.sub.err{color:var(--neg)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:none;border-bottom:3px solid transparent;background:none;border-radius:0;padding:9px 14px;white-space:nowrap;color:var(--muted);font-size:14.5px}
.tabs button:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-0.02em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)} .neg{color:var(--neg)} .strong{font-weight:700;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.tile .k{color:var(--muted);font-size:13px;font-weight:500}
.tile .v{font-size:23px;font-weight:700;margin-top:3px;overflow-wrap:anywhere;letter-spacing:-0.02em}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:500}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.pri:hover{color:#fff;filter:brightness(1.08)}
button.ghost{border:none;background:none;color:var(--muted);padding:2px 6px}
button.ghost:hover{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:hover,select:hover{border-color:var(--muted)}
input.n{font-variant-numeric:tabular-nums;text-align:right;width:100%;font-weight:500}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto;border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
table.wide{min-width:1500px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft);position:sticky;top:0}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--soft)}
td.grp,th.grp{background:var(--soft)}
tbody tr:nth-child(even) td.grp{background:var(--soft)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;background:var(--soft)}
tr.neg-row td:first-child{box-shadow:inset 4px 0 0 var(--neg)}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:500}
.pill.bad{background:transparent;border:1px solid var(--neg);color:var(--neg)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:290px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;align-items:end}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
textarea{width:100%;min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.banner{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:9px 13px;font-size:13.5px}
.alert{display:flex;flex-direction:column;gap:8px}
.alert div{padding:8px 12px;border-left:4px solid var(--neg);background:var(--soft);border-radius:6px}
.help p,.help li{max-width:72ch}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
ol.ana{margin:0;padding:0;list-style:none;display:grid;gap:10px}ol.ana li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}ol.ana li div{margin-top:4px;line-height:1.6}textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
tr.off td{opacity:.5}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}.mk.big{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.mt{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}.mt.big{padding:14px 16px}.mn{font-weight:700;font-size:14px}.mc{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}.mp{font-size:20px;font-weight:700;margin-top:4px}.mt.big .mp{font-size:26px}.mch{font-size:13px;font-weight:600;margin-top:2px}.msp{margin-top:6px}

/* ---- 모바일 최적화 ---- */
html{-webkit-text-size-adjust:100%}
.wrap{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
.scroll{-webkit-overflow-scrolling:touch}
@media(max-width:640px){
 body{font-size:14px;line-height:1.5}
 .wrap{padding:0 10px calc(60px + env(safe-area-inset-bottom))}
 .top{position:static;margin:0 -10px;padding:10px 10px 0;box-shadow:none}
 .title{gap:8px;margin-bottom:4px}
 h1{font-size:18px}
 .sub{font-size:12px;line-height:1.4}
 #autoNote{display:block;margin-top:2px}
 #monthNav{width:100%;flex-wrap:nowrap;gap:6px}
 #monthNav select{flex:1;min-width:0}
 #monthNav button{padding:4px 11px}
 .tabs{position:sticky;top:0;z-index:6;background:var(--surface);margin:0 -10px;padding:0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(20,40,80,.08);scroll-snap-type:x proximity}
 .tabs button{padding:11px 11px;font-size:14px;scroll-snap-align:start}
 main{gap:12px;padding-top:12px}
 .card{padding:12px;border-radius:12px}
 .card h2{font-size:15px;margin-bottom:10px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .tile{padding:10px 11px}
 .tile .k{font-size:11.5px;line-height:1.3}
 .tile .v{font-size:17px}
 .tile .s{font-size:11px;line-height:1.35}
 .mk,.mk.big{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .mt,.mt.big{padding:10px 11px}
 .mn{font-size:13px}.mp{font-size:17px}.mt.big .mp{font-size:19px}.mch{font-size:12px}
 .form{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .form .pri,.form button[type=submit]{grid-column:1/-1}
 .form label.f[style*="span 2"]{grid-column:1/-1!important}
 input,select,textarea{font-size:16px;min-height:40px;padding:6px 9px}
 input[type=checkbox]{min-height:0;width:20px;height:20px}
 button{min-height:38px;padding:6px 12px}
 button.ghost{min-height:32px}
 table{font-size:13px}
 th,td{padding:7px 8px}
 th{font-size:12px}
 td:first-child,th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
 th:first-child{background:var(--soft);z-index:3}
 tbody tr:nth-child(even) td:first-child{background:var(--zebra)}
 .chartbox{height:230px}
 .note{font-size:12px}
 .alert div{padding:7px 10px;font-size:13px}
 ol.ana li{padding:9px 10px}
 .grid2{gap:12px}
 .scroll[style*="max-height"]{max-height:60vh!important}
}
@media(max-width:380px){.tile .v{font-size:15px}.mp{font-size:15px}.mt.big .mp{font-size:17px}}
.cpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fld{display:block}.fld span{display:block;font-size:12px;color:var(--mut,#667);margin-bottom:3px}.fld input,.fld textarea{box-sizing:border-box}
</style>
</head>

var simH={};
function simCalc(h,sm){
  var fx=num(S.set.fx),us=h.mkt==='US';
  var krw=num(sm.krw),usd=num(sm.usd),q=num(sm.qty);
  var p=us?(krw>0?krw:usd*fx):krw;
  var cur=px(h.tk),curWon=cur>0?(us?cur*fx:cur):0;
  var r={p:p,q:q,ok:false,curWon:curWon};
  if(!h.hasCost||!(p>0)||!(q>0))return r;
  var nq=h.qty+q,nc=h.cost+p*q,navg=nc/nq,val=curWon*nq;
  r.ok=true;r.nq=nq;r.nc=nc;r.navg=navg;r.navgUsd=us?navg/fx:0;r.add=p*q;r.diff=navg/h.avgWon-1;
  r.val=curWon>0?val:0;r.pl=curWon>0?val-nc:null;r.ret=(r.pl!==null&&nc>0)?r.pl/nc:null;r.be=curWon>0?nc/val-1:null;
  return r;
}

  pts.push(w+','+(h-3-(c[c.length-1]-mn)/rg*(h-6)).toFixed(1));
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none"><polyline fill="none" stroke="'+(up?'var(--pos)':'var(--neg)')+'" stroke-width="1.8" stroke-linejoin="round" points="'+pts.join(' ')+'"/></svg>';}
function mkTile(name,code,d,fmt,big,sub){
  if(!d)return '<div class="mt'+(big?' big':'')+'" data-mkn="'+esc(name)+'" style="cursor:pointer"><div class="mn">'+esc(name)+(code?' <span class="mc">'+esc(code)+'</span>':'')+'</div><div class="mp num">—</div><div class="mch num">연결 대기</div></div>';
  var ch=d.prev>0?d.p/d.prev-1:0,up=ch>=0;
  return '<div class="mt'+(big?' big':'')+'" data-mkn="'+esc(name)+'" style="cursor:pointer"><div class="mn">'+esc(name)+(code?' <span class="mc">'+esc(code)+'</span>':'')+'</div><div class="mp num">'+fmt(d.p)+'</div><div class="mch num '+cl(ch)+'">'+(d.prev>0?(up?'▲ ':'▼ ')+Math.abs(ch*100).toFixed(2)+'%':'—')+(sub?' <span class="mc">'+sub+'</span>':'')+'</div><div class="msp">'+spark(d.c,up,200,big?64:44)+'</div></div>';}
function vMktTiles(){
  var fw=function(x){return Math.round(x).toLocaleString('ko-KR')+'원';},fi=function(x){return x.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});},fu=function(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var h='<div class="card"><h2>시장 현황 <span class="sub">'+(LIVE.t?new Date(LIVE.t).toLocaleTimeString('ko-KR')+' 기준 · 1분마다 갱신'+diagTxt():'연결 대기')+'</span></h2><div class="mk big">';
  MK.filter(function(x){return x.big;}).forEach(function(x){h+=mkTile(x.n,x.c,MKT[x.s],x.u==='원'?fw:fi,true,MKT[x.s]&&MKT[x.s].src==='HL'?(x.krw?'$'+fi(MKT[x.s].usd)+' · ':'')+'24h 선물':(x.coin&&MKT[x.s]?(MKT[x.s].src||''):''));});
  if(LIVE.t&&MK.filter(function(x){return !x.fxItem&&MKT[x.s]&&MKT[x.s].prev>0;}).length<MK.length-1)h+='<p class="note" style="margin:8px 0"><b>일부 시세는 야후 연결이 필요한데 막혀 있습니다.</b> 설정 탭의 시세 서버 주소에 Cloudflare Pages 주소를 넣으면 해결됩니다. 방법은 저장소의 README를 보세요.</p>';
  h+='</div><div class="mk">';
  MK.filter(function(x){return !x.big;}).forEach(function(x){h+=mkTile(x.n,'',MKT[x.s],x.int?fw:(x.u==='원'?function(v){return fi(v)+'원';}:fi),false,MKT[x.s]?(MKT[x.s].src==='HL'?'24h 선물':(MKT[x.s].src||'')):'');});
  h+='</div>';
  var mine=Object.keys(liveSyms()).filter(function(k){return MKT[k]&&/^[A-Z.\-]+$/.test(k)&&!/-KRW$/.test(k);});
  S.trades.forEach(function(t){});
  var held={};try{var a=S.acct;S.acct='전체';calc().H.forEach(function(x){if(x.mkt==='US')held[x.tk]=1;});S.acct=a;}catch(e){}
  mine=mine.filter(function(k){return held[k];});
  if(mine.length){h+='<h2 style="margin:14px 0 8px">내 종목</h2><div class="mk">';mine.forEach(function(k){h+=mkTile(k,'미국',MKT[k],fu,false);});h+='</div>';}
  var W=S.watch||[];if(W.length){h+='<h2 style="margin:14px 0 8px">관심 종목</h2><div class="mk">';W.forEach(function(k){h+=mkTile(k,/^\d{6}$/.test(k)?'국내':'미국',MKT[k],/^\d{6}$/.test(k)?fw:fu,false);});h+='</div>';}
  return h+'<p class="note">야후 파이낸스 기준이며 정규장 마지막 가격입니다. 지수와 선물은 지연될 수 있습니다. 빨간색은 상승, 파란색은 하락입니다.</p></div>';}

function vMkt(){
  var tb=S.set.mkView==='table';
  var h='<div class="row" style="gap:6px;margin:0 0 8px;justify-content:flex-end"><button type="button" class="'+(tb?'ghost':'')+'" data-mkv="tile">카드로 보기</button><button type="button" class="'+(tb?'':'ghost')+'" data-mkv="table">표로 보기</button></div><div class="row" style="gap:6px;margin:0 0 8px;flex-wrap:wrap"><input id="wAdd" placeholder="종목코드 추가 (예: TSLA, 005930)" style="width:230px" aria-label="종목코드"><button type="button" id="wBtn">추가</button>'+(S.watch||[]).map(function(k){return '<span class="pill">'+esc(k)+' <a href="#" data-wdel="'+esc(k)+'" style="text-decoration:none">×</a></span>';}).join('')+'</div>';
  return h+(tb?vMktTable():vMktTiles());}
function vMktTable(){
  var fw=function(x){return Math.round(x).toLocaleString('ko-KR');},fi=function(x){return x.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var row=function(n,sub,d,f,pre){if(!d)return '<tr data-mkn="'+esc(n)+'" style="cursor:pointer"><td class="l">'+esc(n)+'</td><td class="num">—</td><td class="num">연결 대기</td><td class="l sub"></td></tr>';
    var ch=d.prev>0?d.p/d.prev-1:null;
    return '<tr data-mkn="'+esc(n)+'" style="cursor:pointer"><td class="l">'+esc(n)+(sub?' <span class="sub">'+esc(sub)+'</span>':'')+'</td><td class="num">'+(pre||'')+f(d.p)+'</td><td class="num '+cl(ch)+'">'+(ch===null?'—':spc(ch))+'</td><td class="l sub">'+(d.src==='HL'?'24h 선물':(d.src||''))+'</td></tr>';};
  var h='<div class="card"><h2>시장 현황 <span class="sub">'+(LIVE.t?new Date(LIVE.t).toLocaleTimeString('ko-KR')+' 기준 · 1분마다 갱신'+diagTxt():'연결 대기')+'</span></h2><div class="scroll"><table><thead><tr><th>지표</th><th>현재가</th><th>일간%</th><th class="l">출처</th></tr></thead><tbody>';
  MK.forEach(function(x){var d=MKT[x.s];h+=row(x.n,x.c&&x.c!=='선물'?x.c:'',d,x.u==='원'?(x.krw||x.int||x.fxItem?fw:fi):fi,x.u==='원'?'₩ ':'');});
  var held={};try{var a=S.acct;S.acct='전체';calc().H.forEach(function(x){if(x.mkt==='US'&&x.qty>=0.01)held[x.tk]=1;});S.acct=a;}catch(e){}
  var mine=Object.keys(held).filter(function(k){return MKT[k];});
  if(mine.length){h+='<tr><td class="l" colspan="4"><b>내 보유 종목</b></td></tr>';mine.forEach(function(k){h+=row(k,'미국',MKT[k],fi,'$ ');});}
  var W=S.watch||[];if(W.length){h+='<tr><td class="l" colspan="4"><b>관심 종목</b></td></tr>';W.forEach(function(k){h+=row(k,'관심',MKT[k],fi,/^\d{6}$/.test(k)?'₩ ':'$ ');});}
  return h+'</tbody></table></div><p class="note">거래량은 연결된 시세 출처에서 제공하지 않아 표시하지 않습니다. 선물 표시는 24시간 선물가입니다.</p></div>';}

/* ---------- 종목 상세(차트) ---------- */
var TVMAP={'005930.KS':'KRX:005930','000660.KS':'KRX:000660','005380.KS':'KRX:005380','NQ=F':'CME_MINI:NQ1!','KR200':'KRX:KOSPI200','KRW=X':'FX_IDC:USDKRW','^GSPC':'SP:SPX','BTC-KRW':'UPBIT:BTCKRW'};
function mkResolve(name){var x=MK.filter(function(m){return m.n===name;})[0];
  if(x)return {name:name,key:x.s,tv:TVMAP[x.s]||x.s,krw:x.u==='원'};
  if(/^\d{6}$/.test(name))return {name:name,key:name,tv:'KRX:'+name,krw:true};
  return {name:name,key:name,tv:name,krw:false};}
function openMk(name){
  var r=mkResolve(name);if(!document.body)return;
  var old=document.getElementById('mkPanel');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var p=document.createElement('div');p.id='mkPanel';
  p.setAttribute('style','position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px');
  var url='https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(r.tv)+'&interval=D&theme=light&style=1&locale=kr&timezone=Asia%2FSeoul&hidesidetoolbar=1&withdateranges=1';
  p.innerHTML='<div style="background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:94vh;overflow:auto;padding:14px 16px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><b style="font-size:18px">'+esc(r.name)+'</b> <span class="sub">'+esc(r.tv)+'</span><div id="mkPx" class="num" style="font-size:28px;font-weight:700;margin-top:4px"></div><div id="mkCh" class="num"></div></div><button type="button" id="mkClose" class="ghost">닫기</button></div><iframe src="'+url+'" style="width:100%;height:420px;border:0;margin-top:10px" title="차트"></iframe><p class="note">차트는 TradingView 제공이며 지연될 수 있습니다. 위 현재가는 이 장부의 시세 연동 값입니다.</p></div>';
  document.body.appendChild(p);
  var close=function(){if(p.parentNode)p.parentNode.removeChild(p);};
  document.getElementById('mkClose').onclick=close;p.onclick=function(e){if(e.target===p)close();};
  p.setAttribute('data-key',r.key);p.setAttribute('data-krw',r.krw?'1':'');mkPanelUpd();}
function mkPanelUpd(){var p=document.getElementById('mkPanel');if(!p||!p.getAttribute)return;var d=MKT[p.getAttribute('data-key')],a=document.getElementById('mkPx'),b=document.getElementById('mkCh');if(!a||!b)return;
  if(!d){a.textContent='시세 연결 대기';b.textContent='';return;}
  var krw=p.getAttribute('data-krw'),ch=d.prev>0?d.p/d.prev-1:null;
  a.textContent=(krw?'₩ ':'')+d.p.toLocaleString('ko-KR',{maximumFractionDigits:krw?0:2,minimumFractionDigits:krw?0:2});b.className='num '+cl(ch);b.textContent=ch===null?'':spc(ch);}
function liveNote(){var an=document.getElementById('autoNote');if(!an)return;
  if(S.set.live===false){an.innerHTML='실시간 시세 꺼짐 · 현재가는 직접 입력한 값입니다 <button id="liveBtn" type="button" class="ghost">시세 새로고침</button>';}
  else if(LIVE.busy){an.textContent='시세 불러오는 중…';return;}
  else if(LIVE.t&&LIVE.ok>0){an.innerHTML='시세 '+new Date(LIVE.t).toLocaleTimeString('ko-KR')+' 기준 ('+LIVE.ok+'/'+LIVE.total+'개'+(LIVE.fail.length?' · 실패 '+LIVE.fail.join(', '):'')+(LIVE.fx?' · 환율 '+Math.round(LIVE.fx)+'원':'')+')'+diagTxt()+' <button id="liveBtn" type="button" class="ghost">새로고침</button>';}
  else if(LIVE.t){an.innerHTML='시세 일부 연결 실패 · 직접 입력한 현재가를 씁니다'+diagTxt()+' <button id="liveBtn" type="button" class="ghost">다시 시도</button>';}
  else{an.innerHTML='현재가는 직접 입력한 값입니다 <button id="liveBtn" type="button" class="ghost">시세 새로고침</button>';}
  var b=document.getElementById('liveBtn');if(b)b.onclick=function(){liveRefresh();};}
function diagTxt(){var d=LIVE.d;if(!d)return '';return ' · 하이퍼리퀴드 '+(d.hl?'✓':'✗')+' · 환율 '+(d.fx?'✓':'✗')+' · 야후 '+(d.y?'✓':'✗');}
async function liveRefresh(){
  if(LIVE.busy)return;LIVE.busy=true;liveNote();
  var syms=liveSyms(),ks=Object.keys(syms),ok=0,fail=[],fx=0;
  var paint=function(){LIVE.t=Date.now();save();var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);if(!typing)render();else liveNote();};
  try{
    var r1=await Promise.all([fxFetch(),hlPost({type:'allMids',dex:'xyz'})]);
    fx=r1[0];var HLM=r1[1];LIVE.d={fx:fx>0,hl:!!HLM,y:false};
    if(fx>500&&fx<3000)S.set.fx=Math.round(fx*100)/100;
    var fxu=num(S.set.fx)||1350;
    var pick=function(c){if(!HLM)return null;for(var i=0;i<c.length;i++){if(HLM['xyz:'+c[i]]!==undefined)return 'xyz:'+c[i];}return null;};
    var rest=[],hj=[];
    MK.forEach(function(x){
      if(x.fxItem){MKT[x.s]={p:fxu,prev:0,c:[],t:Date.now()};rest.push(x);return;}
      if(x.coin){hj.push(coinFetch(x.coin).then(function(d){if(d){MKT[x.s]=d;if(S.prices[x.coin]!==undefined||liveSyms()[x.coin])S.prices[x.coin]=d.p;}}));return;}
      var coin=x.hl?pick(x.hl):null;
      if(!coin){rest.push(x);return;}
      hj.push(hlItem(coin,HLM[coin],x.krw?fxu:1).then(function(d){if(d)MKT[x.s]=d;else rest.push(x);}));});
    var held={};
    ks.forEach(function(k){var sy=syms[k],coin=(HLM&&sy===k)?pick([k]):null;if(coin)held[k]=coin;});
    await Promise.all(hj);
    LIVE.ok=0;LIVE.fail=[];LIVE.total=ks.length;LIVE.fx=fx>0?fx:0;
    paint();
    var yoff=LIVE.yb&&(Date.now()-LIVE.yb)<600000,yon=false;
    if(!yoff){var pr=await liveFull('KRW=X');if(pr){yon=true;LIVE.d.y=true;MKT['KRW=X']=pr;if(pr.p>500&&pr.p<3000){fxu=pr.p;S.set.fx=Math.round(pr.p*100)/100;fx=pr.p;LIVE.fx=fx;}}else LIVE.yb=Date.now();}
    var jobs=[];
    if(yon)rest.forEach(function(x){if(x.fxItem||x.coin)return;jobs.push(liveFull(x.s).then(function(y){if(y)MKT[x.s]=y;}));});
    ks.forEach(function(k){var sy=syms[k];
      var tryHl=function(){return held[k]?hlItem(held[k],HLM[held[k]],1):Promise.resolve(null);};
      var isC=/-KRW$/.test(sy);
      var p=isC?coinFetch(k):(yon?liveFull(sy).then(function(d){return d||tryHl();}):tryHl());
      jobs.push(p.then(function(d){if(d){MKT[sy]=d;S.prices[k]=d.p;ok++;}else fail.push(k);}));});
    await Promise.all(jobs);
    LIVE.ok=ok;LIVE.fail=fail;
    var mkOk=MK.filter(function(x){return !x.fxItem&&MKT[x.s]&&MKT[x.s].prev>0;}).length;
    LIVE.fails=(ok+mkOk)>0?0:LIVE.fails+1;
  }catch(e){LIVE.fails++;}
  LIVE.busy=false;paint();}
function liveLoop(){setInterval(function(){if(S.set.live===false||LIVE.fails>=3||document.visibilityState==='hidden')return;var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;liveRefresh();},60000);}
function setStatus(t,e){var s=document.getElementById('status');s.textContent=t;s.className='sub'+(e?' err':'');}
function save(){try{localStorage.setItem('stk_v1',JSON.stringify(S));}catch(e){}clearTimeout(timer);setStatus('저장 중');timer=setTimeout(persist,700);}
async function persist(){if(!remote){setStatus('이 브라우저에만 저장됨');return;}
  try{await remote.set({json:JSON.stringify(S)});setStatus('저장됨 '+new Date().toLocaleTimeString('ko-KR'));}catch(e){setStatus('서버 저장 실패. 이 브라우저에는 저장됨',true);}}
async function load(){
  var local=null;try{local=norm(JSON.parse(localStorage.getItem('stk_v1')));}catch(e){}
  var got=null;
  try{var db=await claude.use('db'),user=await claude.use('user');
    if(db&&user){var id=await user.id();remote=db.collection('data/users/'+id).doc('stock_ledger');
      try{var pr=db.doc('market/prices');var apply=function(sn){var ex2=sn&&(typeof sn.exists==='function'?sn.exists():sn.exists);var d2=sn&&(typeof sn.data==='function'?sn.data():sn);if(ex2!==false&&d2&&d2.prices){AUTO=d2;if(S&&S.set.auto===true&&num(d2.fx)>0)S.set.fx=num(d2.fx);if(S)render();}};apply(await pr.get());if(typeof pr.onSnapshot==='function')pr.onSnapshot(apply);}catch(e2){}
      var snap=await remote.get();var ex=snap&&(typeof snap.exists==='function'?snap.exists():snap.exists);
      var d=snap&&(typeof snap.data==='function'?snap.data():snap);
      if(ex!==false&&d&&d.json)got=norm(JSON.parse(d.json));}}catch(e){remote=null;}
  if(got||local){S=got||local;}
  if(AUTO&&S.set.auto===true&&num(AUTO.fx)>0)S.set.fx=num(AUTO.fx);
  render();
  setStatus(remote?(got?'저장된 데이터를 불러옴':'토스 화면 기준 값 표시 중. 수정하면 저장됩니다'):'이 브라우저에만 저장됨');
}
function route(){var h=location.hash.replace('#','');tab=TABS.some(function(x){return x[0]===h;})?h:'dash';if(S)render();}
window.addEventListener('hashchange',route);
S=seed();route();render();load();
setTimeout(function(){liveRefresh();liveLoop();newsLoop();},1800);
})();
