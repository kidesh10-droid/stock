<style>
/* Layout idea: investment ledger with the same tab structure as the ad ledger the user showed. Soft blue-grey canvas, white cards, Korean convention: red = gain, blue = loss. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

html,body{margin:0}

.top{position:sticky;top:0;z-index:5;background:var(--surface);margin:0 -18px;padding:12px 18px 0;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,40,80,.06)}

.sub{color:var(--muted);font-size:13px}

.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)} .neg{color:var(--neg)} .strong{font-weight:700;color:var(--accent)}

button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:500}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.pri:hover{color:#fff;filter:brightness(1.08)}
button.ghost{border:none;background:none;color:var(--muted);padding:2px 6px}
button.ghost:hover{color:var(--neg)}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto;border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
table.wide{min-width:1500px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft);position:sticky;top:0}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--soft)}
td.grp,th.grp{background:var(--soft)}
tbody tr:nth-child(even) td.grp{background:var(--soft)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;background:var(--soft)}
tr.neg-row td:first-child{box-shadow:inset 4px 0 0 var(--neg)}

.chartbox{position:relative;height:290px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;align-items:end}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
textarea{width:100%;min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.banner{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:9px 13px;font-size:13.5px}
.alert{display:flex;flex-direction:column;gap:8px}

function calc(opt){
  var tr=S.trades.filter(function(t){var cr=t.mkt==='CR';if(opt==='CR')return cr;return !cr&&(S.acct==='전체'||t.acct===S.acct);}).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(ORD[a.side]-ORD[b.side])||(a.id-b.id);});

  });

  Object.keys(m).forEach(function(k){var h=m[k];if(h.qty<=0)return;var key=h.mkt+'|'+h.tk;var g=hm[key]||(hm[key]={mkt:h.mkt,tk:h.tk,qty:0,cost:0,missing:false,accts:{}});g.qty+=h.qty;g.cost+=h.cost;g.missing=g.missing||h.missing;g.accts[h.acct]=1;});
  var fx=num(S.set.fx),H=Object.keys(hm).map(function(k){
    var h=hm[k];h.hasCost=!h.missing&&h.qty>0;h.avgWon=h.qty>0?h.cost/h.qty:0;h.avgUsd=h.mkt==='US'?h.avgWon/fx:0;

}

  var h='<div class="card"><h2>'+esc(head)+'</h2><div class="scroll"><table><thead><tr><th>기간</th><th>거래</th><th>매수금액</th><th>매도금액</th><th>순매수</th><th>누적 순매수</th><th>실현손익</th><th>전기간 대비 실현손익</th></tr></thead><tbody>';
  g.forEach(function(x,i){var a=x.a;cum+=a.net;var pv=i>0?g[i-1].a.real:null;
    h+='<tr><td class="l">'+labelFn(x)+'</td><td class="num">'+a.n+'</td><td class="num">'+won(a.buy)+'</td><td class="num">'+won(a.sell)+'</td><td class="num">'+sw(a.net)+'</td><td class="num">'+sw(cum)+'</td><td class="num '+cl(a.real)+'">'+sw(a.real)+'</td><td class="num '+(pv===null?'':cl(a.real-pv))+'">'+(pv===null?'—':sw(a.real-pv))+'</td></tr>';});
  return h+'</tbody></table></div><p class="note">실현손익은 매도 시점의 이동평균 단가와 비교해 계산하며 수수료를 뺍니다. 기초 잔고는 매수 금액에 포함하지 않습니다.</p></div>';
}

function bindRl(){
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-rid] [data-rf]'),function(e){e.onchange=function(){var id=+e.closest('tr').getAttribute('data-rid'),r=S.rl.filter(function(x){return x.id===id;})[0],f=e.getAttribute('data-rf');
    r[f]=f==='on'?e.checked:(f==='year'||f==='src'||f==='kind'||f==='memo')?e.value:num(e.value);save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-rdel]'),function(b){b.onclick=function(){var id=+b.getAttribute('data-rdel');S.rl=S.rl.filter(function(x){return x.id!==id;});save();render();};});
  var f=document.querySelector('#rForm');if(f)f.onsubmit=function(e){e.preventDefault();var id=Math.max.apply(null,[0].concat(S.rl.map(function(x){return x.id;})))+1;S.rl.push({id:id,year:v('rYear'),on:true,src:v('rSrc').trim(),kind:v('rKind'),real:num(v('rReal')),sell:0,buy:0,fee:0,memo:v('rMemo')});save();render();};
}
var LEV=['TQQQ','SOXL','TSLL','PLTU','TSLS','SNXX','KORU'];
function anaItems(x,tv,fxv){
  var us=x.mkt==='US',cur=x.cur>0?x.cur:0,curW=cur>0?(us?cur*fxv:cur):0,avg=x.hasCost?x.avgWon:0,it=[];
  var fmtP=function(w){return us?'$'+(w/fxv).toFixed(2)+' ('+won(w)+'원)':won(w)+'원';};
  // 1
  if(!x.hasCost||!x.hasVal){it.push(['현재 상태','평균단가나 현재가가 비어 있습니다. 신규 매수 탭이나 종목·평단 탭에서 입력하면 아래 분석이 채워집니다.']);return it;}
  it.push(['현재 상태','보유 '+x.qty.toLocaleString('ko-KR',{maximumFractionDigits:6})+' · 평단 '+fmtP(avg)+' · 현재가 '+fmtP(curW)+' · 평가손익 <b class="'+cl(x.pl)+'">'+sw(x.pl)+'원 ('+spc(x.ret)+')</b> · 포트폴리오 비중 '+(tv>0?pc(x.valWon/tv):'—')]);
  // 2
  if(x.ret>=0)it.push(['본전 조건','이미 평단 위입니다. 평단까지 여유는 '+spc(curW/avg-1)+'입니다. 이익 구간이라 아래 5번의 목표선을 미리 정해 두세요.']);
  else{var be=x.breakeven;it.push(['본전 조건','본전까지 현재가에서 <b>'+spc(be)+'</b> 올라야 합니다. 본전 가격은 '+fmtP(avg)+'입니다.'+(LEV.indexOf(x.tk.toUpperCase())>=0&&x.ret<=-0.3?' 레버리지 상품은 등락이 반복되면 기초지수가 제자리로 돌아와도 상품 가격은 덜 회복될 수 있어, 본전 기대치를 보수적으로 보세요.':'')]);}
  // 3
  var t3=[];
  if(curW>0&&curW<avg){[0.05,0.10,0.20].forEach(function(d){var T=avg*(1-d),xq=(x.cost-T*x.qty)/(T-curW);if(isFinite(xq)&&xq>0)t3.push('평단 −'+(d*100)+'% ('+fmtP(T)+') 만들기: '+xq.toLocaleString('ko-KR',{maximumFractionDigits:2})+'주 추가, 약 <b>'+won(xq*curW)+'원</b>');else t3.push('평단 −'+(d*100)+'%는 현재가가 목표 평단 위라 추가 매수로 만들 수 없습니다.');});
    var q1=1000000/curW,na=(x.cost+1000000)/(x.qty+q1);t3.push('참고: 지금가로 100만원 추가하면 평단 '+fmtP(na)+' ('+spc(na/avg-1)+')');}
  else if(curW>0)t3.push('현재가가 평단 위라 추가 매수하면 평단이 올라갑니다. 100만원 추가 시 평단 '+fmtP((x.cost+1000000)/(x.qty+1000000/curW))+'.');
  t3.push('정확한 수량 계산은 신규 매수 탭에서 단가와 수량을 넣어 보세요.');
  it.push(['평단 낮추기 (추가 매수 시나리오)',t3.join('<br>')]);
  // 4
  var t4=[],lev=LEV.indexOf(x.tk.toUpperCase())>=0;
  if(tv>0&&x.valWon/tv>=0.4)t4.push('비중 '+pc(x.valWon/tv)+'로 한 종목에 40% 이상입니다. 추가 매수보다 비중 낮추기를 먼저 보세요.');
  else if(tv>0&&x.valWon/tv>=0.25)t4.push('비중 '+pc(x.valWon/tv)+'로 큰 편입니다. 추가 매수 시 한 번에 몰지 말고 나눠서 하세요.');
  else t4.push('비중 '+(tv>0?pc(x.valWon/tv):'—')+'로 부담스러운 수준은 아닙니다.');
  if(lev)t4.push('레버리지·인버스 계열로 분류된 종목입니다. 하락장에서 손실이 커지고 오래 들고 가면 가격이 깎일 수 있으니 기간과 한도를 정해 두세요.');
  if(x.ret<=-0.5)t4.push('손실이 −50% 이하입니다. 같은 금액을 추가해도 본전에 필요한 상승이 크니, 추가 매수 한도를 따로 정해 두세요.');
  it.push(['위험·비중 점검',t4.join('<br>')]);
  // 5
  var lv=[['점검 (평단 −30%)',0.7],['본전 (평단)',1],['1차 목표 (평단 +10%)',1.1],['2차 목표 (평단 +20%)',1.2]];
  it.push(['기준 가격과 내 대응 메모',lv.map(function(a){return a[0]+': '+fmtP(avg*a[1]);}).join(' · ')+'<br><span class="note">가격선은 평단 기준 예시입니다. 아래 메모에 내 규칙을 적어 두세요.</span>']);
  return it;
}
function vAna(){
  var C=calc(),H=C.H,tv=0,fxv=num(S.set.fx)||1,loss=[],big=[],levV=0;
  H.forEach(function(x){tv+=x.valWon;if(LEV.indexOf(x.tk.toUpperCase())>=0)levV+=x.valWon;});
  H.forEach(function(x){if(x.ret!==null&&x.ret<0)loss.push(x);if(tv>0&&x.valWon/tv>=0.4)big.push(x);});
  loss.sort(function(a,b){return a.ret-b.ret;});
  var cash=num(S.set.cash);S.plans=S.plans||{};
  var h='<div class="card"><h2>현재 대응 요약 ('+esc(S.acct)+')</h2><div class="alert">'
   +'<div><b>1.</b> 손실 종목 '+loss.length+'개 / 전체 '+H.length+'개'+(loss.length?' · 가장 큰 손실: <b>'+esc(loss[0].tk)+'</b> <span class="num neg">'+spc(loss[0].ret)+'</span>':'')+'</div>'
   +'<div><b>2.</b> 레버리지·인버스 계열 비중 <span class="num">'+(tv>0?pc(levV/tv):'—')+'</span> ('+won(levV)+'원)</div>'
   +'<div><b>3.</b> 한 종목 40% 이상: '+(big.length?big.map(function(x){return '<b>'+esc(x.tk)+'</b> '+pc(x.valWon/tv);}).join(', '):'없음')+'</div>'
   +'<div><b>4.</b> 예수금 '+won(cash)+'원 · 주식 평가금액의 '+(tv>0?pc(cash/tv):'—')+'</div>'
   +'<div><b>5.</b> 추가 매수 전에 아래 종목별 1~5번을 읽고, 내 대응 메모에 규칙을 적어 두세요.</div></div></div>';
  H.slice().sort(function(a,b){return (a.ret===null?9:a.ret)-(b.ret===null?9:b.ret);}).forEach(function(x){
    var it=anaItems(x,tv,fxv);
    h+='<div class="card"><h2>'+esc(x.tk)+' <span class="pill">'+(x.mkt==='US'?'미국':'국내')+'</span> '+judge(x)+'</h2><ol class="ana">'
      +it.map(function(a,i){return '<li><b>'+(i+1)+'. '+a[0]+'</b><div>'+a[1]+'</div></li>';}).join('')+'</ol>'
      +'<label class="f" style="margin-top:8px">내 대응 메모<textarea data-plan="'+esc(x.tk)+'" rows="3" style="width:100%" placeholder="예: 평단 −20%까지 2회 나눠 매수, 본전 도달 시 절반 정리">'+esc(S.plans[x.tk]||'')+'</textarea></label></div>';});
  if(!H.length)h+='<div class="card"><p class="note">보유 종목이 없습니다.</p></div>';
  return h+'<p class="note">규칙에 따라 계산한 참고 자료이며 매수·매도 권유가 아닙니다. 레버리지 분류 종목은 코드의 LEV 목록 기준입니다.</p>';
}

var simH={};
function simCalc(h,sm){
  var fx=num(S.set.fx),us=h.mkt==='US';
  var krw=num(sm.krw),usd=num(sm.usd),q=num(sm.qty);
  var p=us?(krw>0?krw:usd*fx):krw;
  var cur=px(h.tk),curWon=cur>0?(us?cur*fx:cur):0;
  var r={p:p,q:q,ok:false,curWon:curWon};
  if(!h.hasCost||!(p>0)||!(q>0))return r;
  var nq=h.qty+q,nc=h.cost+p*q,navg=nc/nq,val=curWon*nq;
  r.ok=true;r.nq=nq;r.nc=nc;r.navg=navg;r.navgUsd=us?navg/fx:0;r.add=p*q;r.diff=navg/h.avgWon-1;
  r.val=curWon>0?val:0;r.pl=curWon>0?val-nc:null;r.ret=(r.pl!==null&&nc>0)?r.pl/nc:null;r.be=curWon>0?nc/val-1:null;
  return r;
}

    if(tab==='wk')mk('c1',{type:'bar',data:{labels:L,datasets:[{label:'순매수',data:g.map(function(x){return Math.round(x.a.net);}),backgroundColor:acc}]},options:{plugins:{legend:{display:false}},scales:{x:{},y:{ticks:{callback:k}}}}});
    else mk('c1',{type:'bar',data:{labels:L,datasets:[{label:'매수',data:g.map(function(x){return Math.round(x.a.buy);}),backgroundColor:acc},{label:'매도',data:g.map(function(x){return Math.round(x.a.sell);}),backgroundColor:warn}]},options:{scales:{x:{},y:{ticks:{callback:k}}}}});
    mk('c2',{type:'bar',data:{labels:L,datasets:[{label:'실현손익',data:g.map(function(x){return Math.round(x.a.real);}),backgroundColor:g.map(function(x){return x.a.real>=0?pos:neg;})}]},options:{plugins:{legend:{display:false}},scales:{x:{},y:{ticks:{callback:k}}}}});
  }
}

/* ---------- shell ---------- */
function render(){
  var nav=document.getElementById('monthNav');
  var as=['전체'].concat(accts());
  nav.innerHTML='<select id="acctSel" aria-label="계좌">'+as.map(function(a){return '<option'+(a===S.acct?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select><button id="pm" type="button" aria-label="이전 달">◀</button><b class="num">'+S.month+(S.month===nowKey()?' · 이번 달':'')+'</b><button id="nm" type="button" aria-label="다음 달">▶</button>';
  document.getElementById('acctSel').onchange=function(e){S.acct=e.target.value;save();render();};
  document.getElementById('pm').onclick=function(){S.month=addMonth(S.month,-1);save();render();};
  document.getElementById('nm').onclick=function(){S.month=addMonth(S.month,1);save();render();};
  var an=document.getElementById('autoNote');
  if(an){var ks=AUTO&&AUTO.prices?Object.keys(AUTO.prices):[];an.textContent=S.set.auto!==true?'종가 자동 반영 꺼짐 · 현재가는 직접 입력한 값입니다':(ks.length?'종가 자동 반영 중 · 기준일 '+(AUTO.asOf||'—')+' · '+ks.length+'개 종목'+(AUTO.source?' · 출처 '+AUTO.source:''):'종가 자료 없음 · 현재가는 직접 입력한 값입니다');}
  liveNote();
  var t=document.getElementById('tabs');t.innerHTML='';
  TABS.forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=x[1];if(x[0]===tab)b.className='on';b.onclick=function(){location.hash=x[0];};t.appendChild(b);});
  var fn={dash:vDash,ana:vAna,rl:vRl,day:vDay,msum:vMsum,buy:vBuy,btc:vBtc,pen:vPen,items:vItems,notes:vNotes,set:vSet,help:vHelp}[tab];
  document.getElementById('main').innerHTML=fn();
  bind();
  if(tab==='set')document.getElementById('backup').value=JSON.stringify(S);
  drawCharts();
}
function bind(){
  var q=function(s,f){var e=document.querySelector(s);if(e)f(e);};
  Array.prototype.forEach.call(document.querySelectorAll('input.price'),function(inp){inp.onchange=function(){S.prices[inp.getAttribute('data-tk')]=num(inp.value);save();render();};});
  q('#liveChk',function(c){c.onchange=function(){S.set.live=c.checked;save();if(c.checked)liveRefresh();else render();};});
  q('#trForm',function(f){f.onsubmit=function(e){e.preventDefault();
    S.trades.push({id:S.nextId.trades++,date:v('tDate'),acct:v('tAcct'),mkt:v('tMkt'),tk:v('tTk').trim(),side:v('tSide'),price:num(v('tPrice')),qty:num(v('tQty')),fx:num(v('tFx')),fee:num(v('tFee')),memo:v('tMemo')});
    S.month=mkey(v('tDate'));save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){var id=+b.getAttribute('data-del');S.trades=S.trades.filter(function(x){return x.id!==id;});save();render();};});
  q('#csvBtn',function(b){b.onclick=function(){var n=0,bad=0;
    v('csv').split(/\r?\n/).filter(function(x){return x.trim();}).forEach(function(ln,i){var c=ln.split(/\t|,/).map(function(x){return x.trim();});
      var m=(c[0]||'').match(/^(\d{4})[-./]?(\d{1,2})[-./]?(\d{1,2})$/);
      if(!m||c.length<7||(c[2]!=='매수'&&c[2]!=='매도')){if(i>0||m)bad++;return;}
      S.trades.push({id:S.nextId.trades++,date:m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'),acct:c[1],side:c[2],mkt:/^(KR|국내)$/i.test(c[3])?'KR':'US',tk:c[4],price:num(c[5]),qty:num(c[6]),fx:num(c[7]),fee:num(c[8]),memo:''});n++;});
    document.getElementById('csvMsg').textContent=n+'줄 추가'+(bad?', '+bad+'줄은 형식이 맞지 않아 건너뜀':'');if(n){save();setTimeout(render,900);}};});
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-id] input[data-f]'),function(inp){
    var tr=inp.closest('tr'),id=+tr.getAttribute('data-id'),t=S.trades.filter(function(x){return x.id===id;})[0],us=tr.getAttribute('data-us')==='1';
    function fxOf(){return us?(num(t.fx)||num(S.set.fx)):1;}
    function field(f){return tr.querySelector('input[data-f="'+f+'"]');}
    function refresh(){var a=tr.querySelector('[data-o="amt"]');if(a)a.textContent=t.price?won(num(t.price)*num(t.qty)*fxOf()):'—';}
    inp.oninput=function(){var f=inp.getAttribute('data-f'),x=num(inp.value);
      if(f==='usd'){t.price=x;field('krw').value=x?Math.round(x*fxOf()):'';}
      else if(f==='krw'){t.price=us?x/fxOf():x;if(us)field('usd').value=x?+(x/fxOf()).toFixed(4):'';}
      else if(f==='qty'){t.qty=x;}
      else if(f==='fx'){t.fx=x;if(t.price)field('krw').value=Math.round(t.price*fxOf());}
      refresh();save();};
    inp.onchange=function(){render();};
  });
  q('#baseForm',function(f){f.onsubmit=function(e){e.preventDefault();S.trades.push({id:S.nextId.trades++,date:today(),acct:v('bAcct').trim(),mkt:v('bMkt'),tk:v('bTk').trim(),side:'기초',price:num(v('bP')),qty:num(v('bQ')),fx:num(v('bFx')),fee:0,memo:''});save();render();};});
  if(tab==='buy')bindBuy();
  if(tab==='btc')bindBtc();
  if(tab==='pen')bindPen();
  if(tab==='ana')bindAna();
  if(tab==='dash')bindP30();
  if(tab==='rl')bindRl();
  if(tab==='notes')bindJournal();
  q('#noteForm',function(f){f.onsubmit=function(e){e.preventDefault();S.notes.push({id:S.nextId.notes++,date:v('nDate'),tag:v('nTag'),text:v('nText')});save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-delnote]'),function(b){b.onclick=function(){var id=+b.getAttribute('data-delnote');S.notes=S.notes.filter(function(x){return x.id!==id;});save();render();};});
  q('#sAuto',function(e){e.onchange=function(){S.set.auto=e.value==='1';save();render();};});
  var setters={sFx:['fx',1],sCash:['cash',1],sLoan:['loan',1],sTax:['taxRate',0.01],sDed:['deduct',1]};
  Object.keys(setters).forEach(function(id){q('#'+id,function(e){e.onchange=function(){S.set[setters[id][0]]=num(e.value)*setters[id][1];save();render();};});});
  q('#resetBtn',function(b){b.onclick=function(){if(b.getAttribute('data-arm')!=='1'){b.setAttribute('data-arm','1');document.getElementById('armMsg').textContent='한 번 더 누르면 지금까지 입력한 거래와 일지가 모두 지워집니다.';setTimeout(function(){b.removeAttribute('data-arm');var m=document.getElementById('armMsg');if(m)m.textContent='';},4000);return;}S=seed();save();render();};});
  q('#copyBtn',function(b){b.onclick=function(){var m=document.getElementById('bkMsg');try{navigator.clipboard.writeText(v('backup')).then(function(){m.textContent='복사했습니다';},function(){m.textContent='복사하지 못했습니다. 직접 선택해 복사하세요';});}catch(e){m.textContent='복사하지 못했습니다. 직접 선택해 복사하세요';}};});
  q('#loadBtn',function(b){b.onclick=function(){var m=document.getElementById('bkMsg');try{var o=norm(JSON.parse(v('backup')));if(!o){m.textContent='형식이 맞지 않습니다';return;}S=o;save();render();}catch(e){m.textContent='형식이 맞지 않습니다';}};});
}

/* ---------- persistence ---------- */
var LIVE={busy:false,t:0,ok:0,fail:[],fails:0,fx:0,total:0};
function liveSyms(){var m={};S.trades.forEach(function(t){var tk=String(t.tk).toUpperCase();if(t.mkt==='US'&&/^[A-Z][A-Z.\-]{0,5}$/.test(tk))m[tk]=tk;else if(t.mkt==='CR'&&/^[A-Z]{2,6}$/.test(tk))m[tk]=tk+'-KRW';});return m;}
async function liveOne(sym){
  var u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1d&range=5d';
  var tries=[u,'https://corsproxy.io/?'+encodeURIComponent(u),'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
  for(var i=0;i<tries.length;i++){try{var r=await fetch(tries[i],{cache:'no-store'});if(!r.ok)continue;var j=await r.json();var m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;if(m&&m.regularMarketPrice>0)return m.regularMarketPrice;}catch(e){}}
  return 0;}
function liveNote(){var an=document.getElementById('autoNote');if(!an)return;
  if(S.set.live===false){an.innerHTML='실시간 시세 꺼짐 · 현재가는 직접 입력한 값입니다 <button id="liveBtn" type="button" class="ghost">시세 새로고침</button>';}
  else if(LIVE.busy){an.textContent='시세 불러오는 중…';return;}
  else if(LIVE.t&&LIVE.ok>0){an.innerHTML='야후 시세 '+new Date(LIVE.t).toLocaleTimeString('ko-KR')+' 기준 ('+LIVE.ok+'/'+LIVE.total+'개'+(LIVE.fail.length?' · 실패 '+LIVE.fail.join(', '):'')+(LIVE.fx?' · 환율 '+Math.round(LIVE.fx)+'원':'')+') <button id="liveBtn" type="button" class="ghost">새로고침</button>';}
  else if(LIVE.t){an.innerHTML='시세 연결 실패 · 직접 입력한 현재가를 씁니다 <button id="liveBtn" type="button" class="ghost">다시 시도</button>';}
  else{an.innerHTML='현재가는 직접 입력한 값입니다 <button id="liveBtn" type="button" class="ghost">시세 새로고침</button>';}
  var b=document.getElementById('liveBtn');if(b)b.onclick=function(){liveRefresh();};}
async function liveRefresh(){
  if(LIVE.busy)return;LIVE.busy=true;liveNote();
  var syms=liveSyms(),ks=Object.keys(syms),ok=0,fail=[];
  var fx=await liveOne('KRW=X');if(fx>500&&fx<3000)S.set.fx=Math.round(fx*100)/100;
  await Promise.all(ks.map(async function(k){var p=await liveOne(syms[k]);if(p>0){S.prices[k]=p;ok++;}else fail.push(k);}));
  LIVE.busy=false;LIVE.t=Date.now();LIVE.ok=ok;LIVE.fail=fail;LIVE.fx=fx>0?fx:0;LIVE.total=ks.length;LIVE.fails=ok>0?0:LIVE.fails+1;
  if(ok>0||fx>0){save();var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);if(!typing)render();else liveNote();}else liveNote();}
function liveLoop(){setInterval(function(){if(S.set.live===false||LIVE.fails>=3||document.visibilityState==='hidden')return;var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;liveRefresh();},60000);}
function setStatus(t,e){var s=document.getElementById('status');s.textContent=t;s.className='sub'+(e?' err':'');}
function save(){try{localStorage.setItem('stk_v1',JSON.stringify(S));}catch(e){}clearTimeout(timer);setStatus('저장 중');timer=setTimeout(persist,700);}
async function persist(){if(!remote){setStatus('이 브라우저에만 저장됨');return;}
  try{await remote.set({json:JSON.stringify(S)});setStatus('저장됨 '+new Date().toLocaleTimeString('ko-KR'));}catch(e){setStatus('서버 저장 실패. 이 브라우저에는 저장됨',true);}}
async function load(){
  var local=null;try{local=norm(JSON.parse(localStorage.getItem('stk_v1')));}catch(e){}
  var got=null;
  try{var db=await claude.use('db'),user=await claude.use('user');
    if(db&&user){var id=await user.id();remote=db.collection('data/users/'+id).doc('stock_ledger');
      try{var pr=db.doc('market/prices');var apply=function(sn){var ex2=sn&&(typeof sn.exists==='function'?sn.exists():sn.exists);var d2=sn&&(typeof sn.data==='function'?sn.data():sn);if(ex2!==false&&d2&&d2.prices){AUTO=d2;if(S&&S.set.auto===true&&num(d2.fx)>0)S.set.fx=num(d2.fx);if(S)render();}};apply(await pr.get());if(typeof pr.onSnapshot==='function')pr.onSnapshot(apply);}catch(e2){}
      var snap=await remote.get();var ex=snap&&(typeof snap.exists==='function'?snap.exists():snap.exists);
      var d=snap&&(typeof snap.data==='function'?snap.data():snap);
      if(ex!==false&&d&&d.json)got=norm(JSON.parse(d.json));}}catch(e){remote=null;}
  if(got||local){S=got||local;}
  if(AUTO&&S.set.auto===true&&num(AUTO.fx)>0)S.set.fx=num(AUTO.fx);
  render();
  setStatus(remote?(got?'저장된 데이터를 불러옴':'토스 화면 기준 값 표시 중. 수정하면 저장됩니다'):'이 브라우저에만 저장됨');
}
function route(){var h=location.hash.replace('#','');tab=TABS.some(function(x){return x[0]===h;})?h:'dash';if(S)render();}
window.addEventListener('hashchange',route);
S=seed();route();render();load();
setTimeout(function(){liveRefresh();liveLoop();},1800);
})();
</script>
